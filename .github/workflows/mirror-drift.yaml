name: '[Maintenance] Third-party mirror drift'

# The payload goldens are regenerated by hand at bump time, so they cannot fail because
# upstream changed. This runs on a schedule instead of in PR CI: it needs network access
# and its result depends on upstream, not on the commit under test.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check mirrors against upstream
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e +o pipefail
          ./scripts/check-mirror-drift.sh > drift.log 2>&1
          status=$?
          cat drift.log
          echo "drifted=${status}" >> "$GITHUB_OUTPUT"

      - name: Report drift
        if: steps.check.outputs.drifted != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: 'Third-party mirrors have drifted from upstream'
        run: |
          {
            echo 'Upstream changed in files the `internal/apis` mirrors derive from.'
            echo
            echo 'Re-extract per the package `doc.go`, regenerate `testdata/` from the new'
            echo 'upstream types (never from the mirror), bump `tag` in'
            echo '`third_party_mirrors.json` and the version in `doc.go`, then run the tests.'
            echo
            echo '<details><summary>Drift report</summary>'
            echo
            echo '```diff'
            # Issue bodies cap at 65536 characters.
            head -c 55000 drift.log
            echo '```'
            echo '</details>'
          } > body.md

          existing=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')

          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body-file body.md
          else
            gh issue create --title "${TITLE}" --body-file body.md
          fi
