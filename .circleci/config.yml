version: 2.1

orbs:
  go: circleci/go@3.0.3
  aws-ecr: circleci/aws-ecr@9.7.0
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  checkout_code:
    docker:
      - image: cimg/base:current
    circleci_ip_ranges: true
    steps:
      - run: mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - run: git clone "$CIRCLE_REPOSITORY_URL" --branch "$CIRCLE_BRANCH" .
      - run: git checkout "$CIRCLE_SHA1"
      - run: git fetch origin main
      - save_cache:
          key: sourcecode-{{ .Revision }}
          paths:
            - .

  release-version:
    docker:
      - image: cimg/base:current
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - run:
          name: Compute next semantic-release version
          command: |
            # A production release in progress may still create a tag this version has to be based on
            runs_url="https://api.github.com/repos/AikidoSec/kubernetes-agent/actions/workflows/release.yaml/runs"
            while true; do
              queued=$(curl -sSf "${runs_url}?status=queued&per_page=1" | jq '.total_count')
              in_progress=$(curl -sSf "${runs_url}?status=in_progress&per_page=1" | jq '.total_count')

              if [ "$((queued + in_progress))" -eq 0 ]; then
                break
              fi

              echo "Waiting for the production release to finish"
              sleep 60
            done

            # The source cache can be older than the latest release, so fetch the tags
            git fetch --tags https://github.com/AikidoSec/kubernetes-agent.git

            curl -sSfL -o /tmp/semantic-release https://github.com/go-semantic-release/semantic-release/releases/download/v2.31.0/semantic-release_v2.31.0_linux_amd64
            echo "b8f518b1aeb1d1742f4e6e91a179b707cea4309a64fe3854f465bf724f04f6d3  /tmp/semantic-release" | sha256sum -c -
            chmod +x /tmp/semantic-release
            /tmp/semantic-release --dry --no-ci --allow-no-changes --version-file --provider git --provider-opt default_branch=main

            mkdir -p /tmp/workspace
            if [ -s .version-unreleased ]; then
              echo "v$(cat .version-unreleased)" > /tmp/workspace/version
            else
              touch /tmp/workspace/version
            fi
            echo "Release version: $(cat /tmp/workspace/version)"
      - persist_to_workspace:
          root: /tmp/workspace
          paths:
            - version

  verification:
    docker:
      - image: cimg/go:1.27
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.15.0
      - run:
          name: Run linter
          command: golangci-lint run
      - run:
          name: Run tests
          command: go test -race -coverprofile=coverage.out ./...
      - run:
          name: Print coverage
          command: go tool cover -func=coverage.out

  commitmsglint:
    docker:
      - image: cimg/python:3.13
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - run:
          name: Install pre-commit
          command: pip install pre-commit
      - run:
          name: Validate Commit Messages
          command: |
            # Loop through every commit from main to HEAD
            for commit_hash in $(git log origin/main..HEAD --no-merges --pretty=format:"%H"); do
              git log -1 --pretty=%B $commit_hash > .git/COMMIT_EDITMSG
              pre-commit run conventional-pre-commit --hook-stage commit-msg --commit-msg-filename .git/COMMIT_EDITMSG

              if [ $? -ne 0 ]; then
                echo "Commit message for $commit_hash does not conform"
                exit 1
              fi
            done

  build-amd64:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load release version
          command: echo "export VERSION=$(cat /tmp/workspace/version)" >> "$BASH_ENV"
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                profile_name: circleci
                role_arn: ${DEV_AWS_ROLE_ARN}
                region: us-east-1
          account_id: ${DEV_AWS_ACCOUNT_ID}
          checkout: false
          platform: linux/amd64
          profile_name: circleci
          no_output_timeout: 30m
          public_registry: true
          public_registry_alias: aikido-security-staging
          push_image: true
          repo: kubernetes-agent
          tag: ${CIRCLE_SHA1}-amd64
          extra_build_args: --build-arg VERSION=${VERSION}
          region: us-east-1

  build-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load release version
          command: echo "export VERSION=$(cat /tmp/workspace/version)" >> "$BASH_ENV"
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                profile_name: circleci
                role_arn: ${DEV_AWS_ROLE_ARN}
                region: us-east-1
          account_id: ${DEV_AWS_ACCOUNT_ID}
          checkout: false
          platform: linux/arm64
          profile_name: circleci
          no_output_timeout: 30m
          public_registry: true
          public_registry_alias: aikido-security-staging
          push_image: true
          repo: kubernetes-agent
          tag: ${CIRCLE_SHA1}-arm64
          extra_build_args: --build-arg VERSION=${VERSION}
          region: us-east-1

  build-fips-amd64:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Build and push FIPS amd64 image
          command: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

            docker buildx build \
              --platform linux/amd64 \
              --build-arg GOFIPS140=v1.0.0 \
              --build-arg VERSION="$(cat /tmp/workspace/version)" \
              --provenance=false \
              --push \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${CIRCLE_SHA1}-amd64 \
              .

  build-fips-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Build and push FIPS arm64 image
          command: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

            docker buildx build \
              --platform linux/arm64 \
              --build-arg GOFIPS140=v1.0.0 \
              --build-arg VERSION="$(cat /tmp/workspace/version)" \
              --provenance=false \
              --push \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${CIRCLE_SHA1}-arm64 \
              .

  create-manifest:
    docker:
      - image: cimg/base:current
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Create multi-arch manifest
          command: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

            VERSION="$(cat /tmp/workspace/version)"
            docker buildx imagetools create \
              ${VERSION:+-t public.ecr.aws/aikido-security-staging/kubernetes-agent:${VERSION}} \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent:${CIRCLE_SHA1} \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent:latest \
              public.ecr.aws/aikido-security-staging/kubernetes-agent:${CIRCLE_SHA1}-amd64 \
              public.ecr.aws/aikido-security-staging/kubernetes-agent:${CIRCLE_SHA1}-arm64

  create-fips-manifest:
    docker:
      - image: cimg/base:current
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - attach_workspace:
          at: /tmp/workspace
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Create FIPS multi-arch manifest
          command: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

            VERSION="$(cat /tmp/workspace/version)"
            docker buildx imagetools create \
              ${VERSION:+-t public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${VERSION}} \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${CIRCLE_SHA1} \
              -t public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:latest \
              public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${CIRCLE_SHA1}-amd64 \
              public.ecr.aws/aikido-security-staging/kubernetes-agent-fips:${CIRCLE_SHA1}-arm64

workflows:
  pull-request:
    jobs:
      - checkout_code:
          filters:
            branches:
              ignore: main
      - verification:
          requires:
            - checkout_code
          filters:
            branches:
              ignore: main
      - commitmsglint:
          requires:
            - checkout_code
          filters:
            branches:
              ignore: main

  main-deploy:
    jobs:
      - checkout_code:
          filters:
            branches:
              only: main
      - release-version:
          requires:
            - checkout_code
          filters:
            branches:
              only: main
      - build-amd64:
          requires:
            - release-version
          filters:
            branches:
              only: main
          context: staging
      - build-arm64:
          requires:
            - release-version
          filters:
            branches:
              only: main
          context: staging
      - create-manifest:
          requires:
            - build-amd64
            - build-arm64
          filters:
            branches:
              only: main
          context: staging
      - build-fips-amd64:
          requires:
            - release-version
          filters:
            branches:
              only: main
          context: staging
      - build-fips-arm64:
          requires:
            - release-version
          filters:
            branches:
              only: main
          context: staging
      - create-fips-manifest:
          requires:
            - build-fips-amd64
            - build-fips-arm64
          filters:
            branches:
              only: main
          context: staging
